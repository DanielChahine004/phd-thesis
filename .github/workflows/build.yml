# Build the thesis so a current PDF is downloadable from anywhere without a
# local toolchain.
#
# The job installs the environment from pixi.lock, so CI uses the same
# Tectonic as a laptop does. `frozen: true` installs the lock as written and
# never re-solves; swap it for `locked: true` if you would rather CI failed
# when pixi.lock has drifted from pixi.toml.

name: thesis PDF

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the drafts branch, where the paperstore viewer reads the linked draft

# a run of `pixi run sync` can push several times in a minute; only the last
# one is worth building
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdfs:
    name: build the thesis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          frozen: true
          cache: true

      # Tectonic fetches its support bundle on first use and it is large; a
      # cold cache is the difference between a one-minute build and a ten.
      - name: cache the Tectonic bundle
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ hashFiles('pixi.lock') }}
          restore-keys: tectonic-

      # tools/get-biber.sh pulls biber 2.17 from SourceForge on first build.
      # Caching it keeps every run from depending on that host being up.
      - name: cache biber
        uses: actions/cache@v6
        with:
          path: tools/biber
          key: biber-${{ hashFiles('tools/get-biber.sh') }}

      # Each tikzpicture compiles to its own PDF and is remade only when its
      # source changes, so a warm build/ makes the usual run cheap. pgf's .md5
      # stamps decide what to redo, which is why an inexact restore is safe.
      - name: cache the externalised TikZ figures
        uses: actions/cache@v6
        with:
          path: build/thesis
          key: tikz-${{ hashFiles('src/thesis/figures/**', 'src/thesis/chapters/**', 'src/thesis/main.tex') }}
          restore-keys: tikz-

      - name: thesis
        run: pixi run build

      # the writing rules a pattern can decide; runs after the build because it reads the log
      - name: writing checks
        run: pixi run check

      # the draft: every \claim marked and linked; published to the drafts branch as
      # src/thesis/draft.pdf, where the paperstore viewer opens it beside the claims
      - name: draft
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: pixi run draft
      - name: publish the draft to the drafts branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p drafts-out/src/thesis && cp build/thesis-draft/draft.pdf drafts-out/src/thesis/draft.pdf
          cd drafts-out && git init -q -b drafts && git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "Draft of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" drafts

      - name: collect
        run: |
          mkdir -p out
          cp build/thesis/main.pdf      out/thesis.pdf
          ls -lh out

      - uses: actions/upload-artifact@v7
        with:
          name: pdfs-${{ github.sha }}
          path: out/*.pdf
          if-no-files-found: error
          retention-days: 90
